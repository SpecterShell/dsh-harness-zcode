version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # DSH pins its own @deepseek-ai/* versions; major bumps are not ours to take.
    ignore:
      - dependency-name: '@deepseek-ai/*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
