  <title id="title">Microcompaction</title>
  <desc id="desc">Upper bar: a chronological conversation with instructions, tool definitions, user and reply messages, and six tool calls with results R1 to R6, oldest to newest. Lower bar: the oldest result R1 becomes a placeholder while R2 to R6 and every message are kept. Dashed boxes mark the cleared result and the placeholder, and dashed lines link every preserved counterpart. Applies only when it saves at least 256 estimated tokens.</desc>
