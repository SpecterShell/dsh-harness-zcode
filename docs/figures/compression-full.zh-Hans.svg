<svg xmlns="http://www.w3.org/2000/svg" width="900" height="104" viewBox="0 0 900 104" role="img" aria-labelledby="title desc">
  <title id="title">完全压缩</title>
  <desc id="desc">上条：一段按时间排列的对话，含指令、工具定义、一条用户消息和一条回复，随后是六次读取调用 A 到 F 及其结果 R1 到 R6，按从最旧到最新排列。下条：这段对话变为一个摘要检查点，并恢复最新的五个文件 F、E、D、C、B；最旧的文件 A 不恢复。虚线框标出被总结的范围和摘要，虚线连接保留的指令和工具定义。</desc>
