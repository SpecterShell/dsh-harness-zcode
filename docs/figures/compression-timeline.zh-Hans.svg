<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448" role="img" aria-labelledby="title desc">
  <title id="title">随会话步骤变化的估计活跃上下文</title>
  <desc id="desc">一张折线图，展示估计活跃上下文（以 token 计）随会话步骤的变化。上下文增长，在第 12 步和第 22 步达到约 188000 和 182000 token（高于 180000 token 的完全压缩阈值）时急剧下降，然后再次增长。第 9 步的标注标记单请求微压缩投影：由显式 host 调用启用，用量 146000 token，高于 140000 token 阈值，节省至少 256 个估计 token，仅用于下一次请求。</desc>
