<svg xmlns="http://www.w3.org/2000/svg" width="900" height="104" viewBox="0 0 900 104" role="img" aria-labelledby="title desc">
  <title id="title">Full compaction</title>
  <desc id="desc">Upper bar: a chronological conversation with instructions, tool definitions, a user message and a reply, then six read calls A to F and their results R1 to R6, oldest to newest. Lower bar: the conversation becomes one summary checkpoint and the five newest files F, E, D, C and B are restored; the oldest file A is not. Dashed boxes mark the summarized range and the summary, and dashed lines link the preserved instructions and tool definitions.</desc>
